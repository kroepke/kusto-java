name: Nightly oracle
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
jobs:
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: bash oracle/run.sh regenerate
      - run: mvn -B -ntp verify
